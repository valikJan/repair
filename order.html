<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>сервисы</title>
    <link rel="stylesheet" href="style.css">
</head>
   <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P5JZPRXF"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<body>
     <section id="services" class="section" aria-labelledby="services-heading">
      <div class="container">
        <form class="repair-form" onsubmit="event.preventDefault(); document.getElementById('status').style.display='block'; this.reset();">
    <h3>Заявка на ремонт техники</h3>
    
    <input type="text" placeholder="Ваше имя" required>
    <input type="tel" placeholder="Телефон: +7 (___) ___-__-__" required>
    
    <select required>
      <option value="" disabled selected>Выберите тип техники</option>
      <option value="phone">Смартфон / Планшет</option>
      <option value="laptop">Ноутбук / ПК</option>
      <option value="tv">Телевизор</option>
      <option value="appliance">Бытовая техника</option>
    </select>
    
    <textarea placeholder="Опишите поломку" rows="3" required></textarea>
    
    <button type="submit">Заказать ремонт</button>
    <p id="status">Заявка принята! Мастер скоро свяжется с вами.</p>
  </form>
      </div>
    </section>
</body>
</html>
